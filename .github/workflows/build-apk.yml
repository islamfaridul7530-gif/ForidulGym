name: Build Foridul Gym APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V4 project
        run: |
          mkdir -p buildproject
          unzip -q ForidulGymV4.zip -d buildproject
          ls -la buildproject/ForidulGymV4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: buildproject/ForidulGymV4
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ForidulGym-V4-APK
          path: buildproject/ForidulGymV4/app/build/outputs/apk/debug/app-debug.apk
